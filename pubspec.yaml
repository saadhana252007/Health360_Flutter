name: health360ai
description: "Health360 AI — personalized health screening app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Auth + DB
  supabase_flutter: ^2.9.1

  # HTTP client
  dio: ^5.8.0+1

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Media
  image_picker: ^1.1.2

  # Date / number formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
